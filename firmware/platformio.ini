; PlatformIO build file (optional - the Arduino IDE works too: open
; RootSense/RootSense.ino).
;
;   pio run                 build
;   pio run -t upload       build + upload over USB
;   pio device monitor      Serial Monitor (115200 baud)

[platformio]
src_dir = RootSense
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Override PlantConfig.h options here instead of editing it, e.g.
; build_flags = -DZONE_COUNT=1 -DPUMP_MAX_DUTY_PERCENT=85
