# Compiles the firmware for a real ESP32 on every push.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  esp32:
    name: ESP32 core ${{ matrix.core }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "3.3.12"
            label: "(default config)"
            flags: ""
          - core: "2.0.17"
            label: "(default config)"
            flags: ""
          - core: "3.3.12"
            label: "(4 zones, relay, no float switch)"
            flags: "-DZONE_COUNT=4 -DPUMP_DRIVER=2 -DPUMP_ACTIVE_HIGH=false -DTANK_SWITCH_PIN=-1 -DSENSOR_POWER_PIN=4"
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@${{ matrix.core }}" --additional-urls "$ESP32_INDEX"

      - name: Compile for "ESP32 Dev Module"
        run: |
          set -o pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default \
            --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}" \
            --build-property "compiler.c.extra_flags=${{ matrix.flags }}" \
            firmware/RootSense 2>&1 | tee compile.log

      # Puts the first compiler errors on the run's summary page.
      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error|Error" compile.log | head -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done
